# Reusable build for every port in plugins/. Called by plugins.yml (checks) and plugins-release.yml (tags).
name: plugins-build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins
    env:
      WASI_SDK: /opt/wasi-sdk-25.0-x86_64-linux
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins

      # ring (TLS crypto for the Discord gateway) has C parts; wasi-sdk provides clang and a WASI sysroot for them
      - name: Install wasi-sdk
        run: |
          curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz | sudo tar xz -C /opt
          test -x "$WASI_SDK/bin/clang"
          {
            echo "CC_wasm32_wasip2=$WASI_SDK/bin/clang"
            echo "AR_wasm32_wasip2=$WASI_SDK/bin/llvm-ar"
            echo "CFLAGS_wasm32_wasip2=--sysroot=$WASI_SDK/share/wasi-sysroot"
          } >> "$GITHUB_ENV"

      - name: Build (wasm32-wasip2, release)
        run: cargo build --release

      - name: Unit tests (host target)
        run: cargo test --lib --target x86_64-unknown-linux-gnu
        continue-on-error: true

      - name: Collect plugins
        run: |
          mkdir -p ../dist
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | "\(.name) \(.version)"' \
            | while read -r name version; do
                file="target/wasm32-wasip2/release/${name//-/_}.wasm"
                cp "$file" "../dist/${name}-${version}.wasm"
                echo "${name}-${version}.wasm: $(stat -c%s "$file") bytes"
              done
          cp Cargo.lock ../dist/Cargo.lock

      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: dist/
          if-no-files-found: error
